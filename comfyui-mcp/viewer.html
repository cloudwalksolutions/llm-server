<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  img, video { display: block; max-width: 100%; height: auto; border-radius: 8px; }
  #downloads { display: flex; gap: 12px; margin-top: 8px; font: 14px system-ui, sans-serif; }
  #downloads a { color: #2563eb; }
  @media (prefers-color-scheme: dark) { #downloads a { color: #93c5fd; } }
</style>
</head>
<body>
<img id="picture" alt="">
<div id="downloads"></div>
<script>
  const picture = document.getElementById("picture");
  let nextId = 1;

  function send(message) {
    window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");
  }

  function reportSize() {
    send({ method: "ui/notifications/size-changed",
           params: { width: document.body.scrollWidth, height: document.body.scrollHeight } });
  }

  window.addEventListener("message", ({ data }) => {
    if (data?.jsonrpc !== "2.0") return;
    if (data.id === 1 && data.result) {
      send({ method: "ui/notifications/initialized", params: {} });
    }
    if (data.method === "ui/notifications/tool-result") {
      const image = data.params?._meta?.image;
      if (image?.mimeType.startsWith("video/")) {
        const video = document.createElement("video");
        video.controls = video.autoplay = true;
        video.src = `data:${image.mimeType};base64,${image.data}`;
        video.addEventListener("loadedmetadata", reportSize);
        picture.replaceWith(video);
      } else if (image) {
        picture.src = `data:${image.mimeType};base64,${image.data}`;
      }
      for (const file of data.params?._meta?.downloads ?? []) {
        const link = document.createElement("a");
        link.href = `data:${file.mimeType};base64,${file.data}`;
        link.download = file.name;
        link.textContent = `Download ${file.name}`;
        document.getElementById("downloads").append(link);
      }
      reportSize();
    }
  });

  picture.addEventListener("load", reportSize);
  send({ id: nextId++, method: "ui/initialize", params: {
    appInfo: { name: "comfyui-viewer", version: "1.0.0" },
    appCapabilities: {},
    protocolVersion: "2026-01-26",
  } });
</script>
</body>
</html>
