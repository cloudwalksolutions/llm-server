# Fixture for golden render tests. Fixed values — do not tune.
remote:
  host: 10.0.0.10
  user: testuser

runtime:
  engine: docker
  gpu: nvidia
  instances_dir: /opt/llm/instances
  router_map: /etc/llama-router/models.json

defaults:
  kv_unified: false
  batch_size: 1024
  ubatch_size: 256
  threads_gen: 10
  threads_batch: 8
  threads_http: 4
  cache_reuse: 256
  cache_type_k: f16
  cache_type_v: f16
  flash_attn: false
  draft_model: ""
  draft_max: 16
  reasoning: auto
  reasoning_budget: 512
  reasoning_budget_message: Answer now.
  container_image: example.invalid/llama:cuda

instances:
  # kv_unified: true means -c is NOT divided across slots
  shared:
    port: 8081
    model_file: Model-C.gguf
    context_per_request: 8192
    parallel_slots: 2
    kv_unified: true
