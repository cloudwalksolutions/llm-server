# ComfyUI configuration schema. The live target's config is config/comfyui.yaml;
# without that file the target runs no ComfyUI.

enabled: true               # false stops and disables it; make deploy converges either way
port: 8188                  # published on loopback only
api_port: 8189              # COMFYUI_API_HOST's tunnel route; refuses a request without COMFYUI_API_KEY
ui_port: 8190               # COMFYUI_UI_HOST's tunnel route; no key, so gate that hostname with Cloudflare Access
mcp_port: 8191              # the MCP server, on loopback; reached at COMFYUI_API_HOST/mcp with COMFYUI_MCP_KEY
container_image: registry.example/amd-strix-halo-comfyui:tag
dir: /opt/llm/comfyui
vtracer:                    # the static vtracer CLI the logo tool traces SVGs with, installed in <dir>/vtracer
  url: https://example.com/vtracer-x86_64-unknown-linux-musl.tar.gz
  sha256: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
models:                   # each lands at <dir>/models/<dest>, refused unless its sha256 matches
  - repo: org/repo          # Hugging Face, pinned by commit
    revision: 0123456789abcdef0123456789abcdef01234567
    file: split_files/vae/ae.safetensors
    dest: vae/ae.safetensors
    sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - civitai: 123456         # Civitai, pinned by model version ID; CIVITAI_API_TOKEN in .env if it needs sign-in
    dest: loras/my-lora.safetensors
    sha256: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
