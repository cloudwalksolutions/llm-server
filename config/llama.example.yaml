# llama-server Configuration
# Copy this file to config/llama.yaml and customize for your setup

# Remote server connection (password/key set in .env file)
remote:
  host: 192.168.1.168
  user: walkerobrien

# Container runtime and GPU vendor of the TARGET machine.
# Deploy refuses to run if these don't match what's actually installed there —
# an AMD/podman unit on an NVIDIA/docker host produces a service that cannot start.
runtime:
  engine: podman       # podman | docker
  gpu: amd             # amd | nvidia

# llama-server performance parameters
llama:
  # Context window a SINGLE REQUEST gets. This is the number clients care about
  # and the one that shows up as n_ctx in errors and /props.
  #
  # llama.cpp's -c flag is a TOTAL that gets divided across slots:
  #   n_ctx_seq = kv_unified ? n_ctx : PAD256(n_ctx / parallel_slots)
  # Deploy derives -c for you, so set the number you actually want.
  context_per_request: 16384

  # Concurrent request slots. With kv_unified: false each slot gets its own
  # dedicated window, so total KV memory scales with slots × context_per_request.
  parallel_slots: 4

  # false = dedicated per-slot windows (predictable, more memory)
  # true  = one shared pool any request may use (cheaper, slots contend)
  kv_unified: false

  # Batching: batch_size is logical, ubatch_size physical. ubatch <= batch.
  batch_size: 2048
  ubatch_size: 512

  # Threading. gen/batch don't run simultaneously so both can be high.
  threads_gen: 12
  threads_batch: 8
  threads_http: 6

  # Prompt cache reuse threshold. Lower = more aggressive caching.
  cache_reuse: 256

  # KV cache quantization. f16 is the safe default; q8_0 roughly halves KV
  # memory for ~0.05% perplexity. The two MUST match — asymmetric types fall
  # back to CPU attention silently and run 25-45x slower.
  cache_type_k: f16
  cache_type_v: f16

# System resource limits (usually don't need to change)
resources:
  limit_nofile: 65535
  limit_memlock: infinity

# Benchmarking configuration
benchmark:
  concurrent_requests: 4    # Match parallel_slots for testing
  max_tokens: 100
  timeout: 120
