remote:
  host: 192.168.1.168
  user: walkerobrien

runtime:
  engine: podman
  gpu: amd
  instances_dir: /opt/llm/instances
  router_map: /etc/llama-router/models.json
  router_default: qwen3.6-35b-a3b

defaults:
  kv_unified: false
  batch_size: 2048
  ubatch_size: 2048
  threads_gen: 16
  threads_batch: 12
  threads_http: 6
  cache_reuse: 256
  cache_type_k: q8_0
  cache_type_v: q8_0
  flash_attn: false
  draft_model: ""
  draft_max: 16
  spec_type: draft-simple
  reasoning: auto
  reasoning_budget: 512
  reasoning_budget_message: Considering the limited time by the user, I have to give the solution based on the thinking directly now.
  container_image: us-east1-docker.pkg.dev/on-prem-cw-admin-project/llm-images/amd-strix-halo-toolboxes:llamacpp-b11559

instances:
  qwen3-8b:
    port: 8083
    model_file: Qwen3-8B-Q4_K_M.gguf
    context_per_request: 4096
    parallel_slots: 8
    threads_gen: 8
    threads_batch: 6
    threads_http: 4

  qwen3.6-35b-a3b:
    port: 8084
    model_file: Qwen3.6-35B-A3B-Q8_0.gguf
    context_per_request: 131072
    parallel_slots: 2
    reasoning_budget: 2048
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 1.5

resources:
  limit_nofile: 65535
  limit_memlock: infinity
