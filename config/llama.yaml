# llama-server Configuration
# Copy this file to config/llama.yaml and customize for your setup

# Remote server connection (password set in .env file)
remote:
  host: 192.168.1.168
  user: walkerobrien

# llama-server performance parameters
llama:
  # Concurrency: number of parallel request slots
  # Higher = more concurrent requests, more memory usage
  # With q8_0 KV cache: 5.25 GB/slot at 65536 ctx → 16 slots ≈ 84 GB + 9 GB model = 93 GB
  # NOTE: On AMD APU, Vulkan GPU compute shows as D-state processes in load average.
  # Load avg of 60+ during inference is EXPECTED — it reflects GPU work, not CPU overload.
  parallel_slots: 16

  # Batching: controls batch processing sizes
  # batch_size: logical batch (pipeline parallelization)
  # ubatch_size: physical batch (GPU batch, 1:1 ratio for max GPU prefill throughput)
  batch_size: 2048
  ubatch_size: 2048

  # Threading: allocate CPU threads for different tasks
  # Total threads available: 32 (16 cores × 2 threads)
  # threads_gen should equal physical core count — hyperthreading hurts LLM inference
  threads_gen: 16      # Generation (primary inference = physical core count)
  threads_batch: 12    # Batch/prompt processing
  threads_http: 10     # HTTP request handling (I/O bound, HT is fine here)

  # Caching: prompt cache reuse threshold
  # Lower = more aggressive caching (better for similar prompts)
  # Higher = less caching (better for diverse prompts)
  cache_reuse: 256

  # Context window size in tokens
  # Options: 32768, 65536, 131072
  context_size: 65536

  # KV cache quantization (applies to attention key/value tensors)
  # q8_0: half memory vs f16, <0.1% quality loss — recommended
  # q4_0: quarter memory vs f16, ~0.5-1% quality loss
  # f16: full precision, highest memory usage
  cache_type_k: q8_0
  cache_type_v: q8_0

  # Flash attention — DISABLE on AMD Vulkan backend!
  # AMD Vulkan has no GPU-accelerated FA kernel; it falls back to CPU → ~50% perf drop.
  # Only enable if switching to ROCm backend.
  flash_attn: false

  # Speculative decoding — requires a small draft model from the same family
  # Set draft_model to a filename in /opt/llm/models/ to enable (~1.8-2.5x speedup)
  # Download with: make add-model REPO=Qwen/Qwen3-1.5B-GGUF MODEL=Qwen3-1.5B-Q4_K_M.gguf
  draft_model: ""
  draft_max: 16

# System resource limits (usually don't need to change)
resources:
  limit_nofile: 65535
  limit_memlock: infinity

# Benchmarking configuration
benchmark:
  concurrent_requests: 16   # Match parallel_slots for testing
  max_tokens: 100
  timeout: 120
