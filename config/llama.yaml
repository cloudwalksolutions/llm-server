# llama-server Configuration
# Active deploy target. Not in git — see config/llama.example.yaml for docs.

remote:
  host: 192.168.1.168
  user: walkerobrien

runtime:
  engine: podman
  gpu: amd

llama:
  # What a SINGLE request gets. Deploy derives -c = this × parallel_slots.
  # Was effectively 2816 before this change (see CONTEXT_SIZE_ISSUE.md).
  context_per_request: 16384

  # NOTE: On AMD APU, Vulkan GPU compute shows as D-state processes in load
  # average. Load avg of 60+ during inference is EXPECTED — it reflects GPU
  # work, not CPU overload.
  parallel_slots: 16
  kv_unified: false

  # 16384 × 16 = 262144 total. KV at f16 = 40 GiB (40 layers, 160 MiB/1K tokens).
  batch_size: 2048
  # 512, not 2048: with flash_attn off the KQ tensor is materialized and scales
  # with n_ctx × n_ubatch × n_heads. At 16384-token slots that is ~1.3 GB here
  # vs ~5.4 GB at 2048. Raise it once the prefill benchmark says it pays.
  ubatch_size: 512

  # threads_gen = physical core count; hyperthreading hurts LLM inference
  threads_gen: 16
  threads_batch: 12
  threads_http: 10

  cache_reuse: 256

  # f16, not q8_0: q8_0 V cache REQUIRES flash attention, and flash attention
  # is a ~50% loss on the AMD Vulkan backend (no GPU FA kernel, falls back to
  # CPU). At 128 GB, memory is not the binding constraint — so pay memory
  # instead of compute. load_config rejects quantized V with flash_attn: false.
  cache_type_k: f16
  cache_type_v: f16

  # DISABLE on AMD Vulkan. Only enable if switching to a ROCm backend.
  flash_attn: false

  # Speculative decoding — needs a small draft model from the same family.
  # Download with: make add-model REPO=Qwen/Qwen3-1.5B-GGUF MODEL=Qwen3-1.5B-Q4_K_M.gguf
  draft_model: ""
  draft_max: 16

resources:
  limit_nofile: 65535
  limit_memlock: infinity

benchmark:
  concurrent_requests: 16
  max_tokens: 100
  timeout: 120
