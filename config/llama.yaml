# llama-server Configuration
# Active deploy target. Not in git — see config/llama.example.yaml for docs.

remote:
  host: 192.168.1.168
  user: walkerobrien

runtime:
  engine: podman
  gpu: amd

llama:
  # 16384 per request, up from an effective 2816. See CONTEXT_SIZE_ISSUE.md.
  # Derives -c 65536 -np 4 --no-kv-unified.
  # Same total KV as the previous 65536/8 config, redistributed into fewer,
  # larger windows.
  context_per_request: 16384
  parallel_slots: 4
  kv_unified: false

  batch_size: 2048
  ubatch_size: 512

  # 16 cores / 32 threads (Ryzen AI Max+ 395)
  threads_gen: 12
  threads_batch: 8
  threads_http: 6

  cache_reuse: 256

  cache_type_k: f16
  cache_type_v: f16

resources:
  limit_nofile: 65535
  limit_memlock: infinity

benchmark:
  concurrent_requests: 4
  max_tokens: 100
  timeout: 120
