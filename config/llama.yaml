runtime:
  engine: podman
  gpu: amd
  instances_dir: /opt/llm/instances
  router_map: /etc/llama-router/models.json
  router_default: qwen3.6-35b-a3b
  gtt_free_floor_gib: 1
  mem_available_floor_gib: 4

defaults:
  kv_unified: false
  batch_size: 2048
  ubatch_size: 2048
  threads_gen: 16
  threads_batch: 12
  threads_http: 6
  cache_reuse: 256
  cache_type_k: q8_0
  cache_type_v: q8_0
  flash_attn: false
  draft_model: ""
  draft_max: 16
  spec_type: draft-simple
  reasoning: auto
  reasoning_budget: 512
  cache_ram: 1024
  reasoning_budget_message: Considering the limited time by the user, I have to give the solution based on the thinking directly now.
  container_image: us-east1-docker.pkg.dev/on-prem-cw-admin-project/llm-images/amd-strix-halo-toolboxes:llamacpp-b12479

instances:
  qwen3.6-35b-a3b:
    port: 8084
    model_file: Qwen3.6-35B-A3B-Q8_0.gguf
    context_per_request: 262144
    parallel_slots: 3
    kv_unified: true
    kv_pool: 393216
    cache_type_k: f16
    cache_type_v: f16
    mmproj_file: mmproj-Qwen3.6-35B-A3B-BF16.gguf
    image_min_tokens: 1024
    cache_ram: 4096
    reasoning_budget: 2048
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 1.5

  gpt-oss-120b:
    enabled: false
    port: 8090
    model_file: gpt-oss-120b-MXFP4.gguf
    context_per_request: 65536
    parallel_slots: 2
    reasoning_budget: 16384
    sampling:
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      min_p: 0

resources:
  limit_nofile: 65535
  limit_memlock: infinity
